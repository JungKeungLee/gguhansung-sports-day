name: Reverse world verification
on:
  push:
    branches: ['feature/reverse-world-finish']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run balance -- 10000
      - run: npx vite-node scripts/reverse-check.ts 2000
