name: Tight win-rate optimizer
on:
  push:
    branches: ['balance/tight-9_5-to-10_3']
jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx vite-node scripts/tight-balance-optimizer.ts 4500 7 30000
