name: Tight win-rate independent holdout
on:
  push:
    branches: ['balance/tight-final-holdout']
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
  holdout:
    needs: verify
    strategy:
      matrix:
        mode: [mixed, reverse]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx vite-node scripts/tight-balance-holdout.ts ${{ matrix.mode }} 25000 120000
